# STAGING: new.telkganesan.com
# /etc/nginx/sites-available/new.telkganesan.com  -> symlink into sites-enabled
#
# Purpose: run and test the new site on this VPS while telkganesan.com still serves the old
# WordPress from Google Cloud (35.206.66.63). No DNS change to the apex is needed.
#
# PREREQUISITE (Cloudflare, DNS-only / grey cloud):
#     new.telkganesan.com   A   <this server's public IP>      (curl -4 ifconfig.me)
#
# ---------------------------------------------------------------------------
# ORDER MATTERS. nginx will not start if an ssl_certificate file does not exist
# yet, and certbot cannot issue the certificate until nginx answers on :80.
# So bootstrap in three steps:
#
#   1) Put ONLY this minimal block in sites-available/new.telkganesan.com,
#      symlink it, then:  sudo nginx -t && sudo systemctl reload nginx
#
#        server {
#          listen 80;
#          server_name new.telkganesan.com;
#          location /.well-known/acme-challenge/ { root /var/www/certbot; }
#          location / { return 404; }
#        }
#
#   2) sudo mkdir -p /var/www/certbot
#      sudo certbot certonly --webroot -w /var/www/certbot -d new.telkganesan.com
#      (certonly does not rewrite your nginx config)
#
#   3) Replace that file with THIS one, then:
#      sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

upstream tkg_app_staging {
  # Must match APP_PORT in .env. Port 3000 is already taken on this server by another
  # next-server, so 3015 is used here.
  server 127.0.0.1:3015;
  keepalive 16;
}

server {
  listen 80;
  server_name new.telkganesan.com;

  # Keep this reachable so certbot can renew without downtime.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://new.telkganesan.com$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name new.telkganesan.com;

  ssl_certificate     /etc/letsencrypt/live/new.telkganesan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/new.telkganesan.com/privkey.pem;

  client_max_body_size 25m;   # admin uploads (images, PDFs)

  # Staging must never be indexed. The app already returns `Disallow: /` and meta noindex
  # while ALLOW_INDEXING is unset; this header is a third, independent layer so a config
  # mistake in the app cannot leak staging into search results.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  # OPTIONAL: password-protect staging before content is approved.
  #   sudo apt install apache2-utils
  #   sudo htpasswd -c /etc/nginx/.htpasswd-tkg <user>
  # Note: this also prompts for the Payload admin and for any link emailed during testing,
  # so turn it off while testing the seven inquiry routes end to end.
  # auth_basic           "TKG staging";
  # auth_basic_user_file /etc/nginx/.htpasswd-tkg;

  location / {
    proxy_pass http://tkg_app_staging;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
