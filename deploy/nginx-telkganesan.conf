# /etc/nginx/sites-available/telkganesan.com  (then: ln -s into sites-enabled, nginx -t, reload)
# Get the certificate first:  sudo certbot --nginx -d telkganesan.com -d www.telkganesan.com
server {
  listen 80;
  server_name telkganesan.com www.telkganesan.com;
  return 301 https://telkganesan.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.telkganesan.com;
  ssl_certificate     /etc/letsencrypt/live/telkganesan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/telkganesan.com/privkey.pem;
  return 301 https://telkganesan.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name telkganesan.com;
  ssl_certificate     /etc/letsencrypt/live/telkganesan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/telkganesan.com/privkey.pem;

  client_max_body_size 25m;   # admin uploads (images, PDFs)

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
