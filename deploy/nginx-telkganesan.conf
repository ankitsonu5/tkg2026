# PRODUCTION (cutover only): telkganesan.com
# /etc/nginx/sites-available/telkganesan.com  -> symlink into sites-enabled
#
# Do NOT enable this until cutover. Until then the apex points at the old WordPress
# (35.206.66.63, Google Cloud) and the new site runs on new.telkganesan.com — see
# deploy/nginx-new-staging.conf.
#
# ---------------------------------------------------------------------------
# TWO THINGS THAT WILL BITE IF IGNORED
#
# 1. www.telkganesan.com HAS NO DNS RECORD AT ALL (checked 10 Oct 2026: no A, AAAA or
#    CNAME). certbot validates every -d together, so this FAILS entirely:
#        certbot --nginx -d telkganesan.com -d www.telkganesan.com
#    Either create the www record in Cloudflare first, or drop www from both the
#    certbot command and the www server block below.
#
# 2. certbot cannot issue a certificate for telkganesan.com from this server until the
#    apex A record in Cloudflare points HERE. HTTP-01 is answered by whatever the domain
#    resolves to, which is still Google Cloud. So the order at cutover is:
#        a) Cloudflare: apex A -> this server's IP  (curl -4 ifconfig.me), DNS-only
#        b) sudo mkdir -p /var/www/certbot
#           sudo certbot certonly --webroot -w /var/www/certbot -d telkganesan.com
#           (add -d www.telkganesan.com ONLY if that record now exists)
#        c) .env: NEXT_PUBLIC_SERVER_URL + PRODUCTION_ORIGIN -> https://telkganesan.com
#                 ALLOW_INDEXING=true
#        d) npm run build   <- REQUIRED: NEXT_PUBLIC_* are baked at build time
#        e) enable this file, sudo nginx -t && sudo systemctl reload nginx
#
#    Keep the old WordPress host and its DNS values until rollback is no longer needed.
# ---------------------------------------------------------------------------
#
# These blocks are name-based and carry no `default_server`, so the other ~11 sites on
# this box are unaffected. Before enabling, confirm nothing else claims this name:
#     sudo nginx -T | grep -i "server_name.*telkganesan"

upstream tkg_app {
  # Must match APP_PORT in .env. Port 3000 is taken on this server by another next-server.
  server 127.0.0.1:3015;
  keepalive 16;
}

server {
  listen 80;
  server_name telkganesan.com www.telkganesan.com;

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://telkganesan.com$request_uri; }
}

# www -> apex. DELETE this block if you are not creating a www DNS record,
# otherwise nginx will hold a cert reference for a name that cannot be validated.
server {
  listen 443 ssl;
  http2 on;
  server_name www.telkganesan.com;
  ssl_certificate     /etc/letsencrypt/live/telkganesan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/telkganesan.com/privkey.pem;
  return 301 https://telkganesan.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name telkganesan.com;

  ssl_certificate     /etc/letsencrypt/live/telkganesan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/telkganesan.com/privkey.pem;

  client_max_body_size 25m;   # admin uploads (images, PDFs)

  location / {
    proxy_pass http://tkg_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
