# /etc/nginx/sites-available/telkganesan.com  (then: ln -s into sites-enabled, nginx -t, reload)
# Get the certificate first:  sudo certbot --nginx -d telkganesan.com -d www.telkganesan.com
#
# This server hosts several sites. Two things matter:
#  1. PORT — the three proxy_pass lines below must match APP_PORT in .env (default 3000).
#     If another site already uses that port, pick a free one in BOTH places.
#  2. NO default_server here — these blocks are name-based, so they only answer for
#     telkganesan.com and do not affect the other sites already on 80/443.
#     Check first that no other enabled config claims this server_name:
#       grep -rn "server_name" /etc/nginx/sites-enabled/ | grep telkganesan
#     Always:  sudo nginx -t  before  sudo systemctl reload nginx

upstream tkg_app {
  # Must match APP_PORT in .env
  server 127.0.0.1:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name telkganesan.com www.telkganesan.com;
  return 301 https://telkganesan.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.telkganesan.com;
  ssl_certificate     /etc/letsencrypt/live/telkganesan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/telkganesan.com/privkey.pem;
  return 301 https://telkganesan.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name telkganesan.com;
  ssl_certificate     /etc/letsencrypt/live/telkganesan.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/telkganesan.com/privkey.pem;

  client_max_body_size 25m;   # admin uploads (images, PDFs)

  location / {
    proxy_pass http://tkg_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
